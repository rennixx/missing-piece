name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-benchmark:
    name: Validate Skills & Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate Missing Piece Skill Suite
        run: python scripts/validate_skill.py

      - name: Run Missing Piece Benchmark Harness
        run: python scripts/run_benchmark.py
